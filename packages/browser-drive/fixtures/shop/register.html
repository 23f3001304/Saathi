<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bazaar Fixture — Create account</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 30rem; }
      label { display: block; margin-top: 1rem; }
      input { font: inherit; padding: .4rem .6rem; width: 100%; }
    </style>
  </head>
  <body>
    <h1>Create an account</h1>

    <form id="register-form" action="/register" method="post">
      <label for="new-email">Email</label>
      <input id="new-email" name="email" type="email" />

      <label for="new-password">Choose a password</label>
      <input
        id="new-password"
        name="password"
        type="password"
        autocomplete="new-password"
      />

      <label for="aadhaar">Aadhaar number (KYC)</label>
      <input id="aadhaar" name="aadhaar" type="text" inputmode="numeric" maxlength="12" />

      <label for="otp">Enter the OTP we sent you</label>
      <input
        id="otp"
        name="otp"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
      />

      <button id="create" type="submit">Create account</button>
    </form>
  </body>
</html>
