# Judge-runnable stack (ARCHITECTURE §10.4): `docker compose up --build` brings up the
# gateway, the audit UI, and Jaeger tracing in one command. Razorpay keys come from a
# root .env (copy .env.example -> .env first); nothing here hard-fails if it's missing,
# it just means the gateway has no live Razorpay credentials yet.
name: covenant

services:
  gateway-svc:
    build:
      context: .
      dockerfile: apps/gateway-svc/Dockerfile
    ports:
      - "8787:8787"
    environment:
      COVENANT_DB: /data/covenant.db
      # The gateway mints the trust ring; agent-host only reads it, so the keys must
      # live on a shared volume rather than the container's ephemeral layer.
      COVENANT_KEY_DIR: /keys
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - covenant-db:/data
      - covenant-keys:/keys
    healthcheck:
      # /healthz (§10.4) lands with the composition root; start_period is generous so
      # the container isn't flagged unhealthy before that endpoint exists to answer.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  agent-host:
    build:
      context: .
      dockerfile: apps/agent-host/Dockerfile
    ports:
      - "8788:8788"
    environment:
      COVENANT_GATEWAY_URL: http://gateway-svc:8787
      COVENANT_KEY_DIR: /keys
      # One table in the ledger's file — the durable conversation log — so a
      # reloaded chat comes back with its cards and its browser actions. The
      # gateway owns every other table in there; agent-host reads none of them.
      COVENANT_DB: /data/covenant.db
    volumes:
      - covenant-keys:/keys
      - covenant-db:/data
    depends_on:
      gateway-svc:
        condition: service_healthy
    restart: unless-stopped

  audit-ui:
    build:
      context: .
      dockerfile: apps/audit-ui/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - gateway-svc
      - agent-host
    restart: unless-stopped

  merchant-ui:
    build:
      context: .
      dockerfile: apps/merchant-ui/Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      - gateway-svc
    restart: unless-stopped

  # The per-session browser sandbox. This service exists to *build* the image;
  # it is never `up`ed, because one container per browser session is the whole
  # point and agent-host starts each one itself with a lockdown compose cannot
  # express (per-session network, a seccomp profile, a hard lifetime).
  #
  #   docker compose build browser-sandbox
  #
  # agent-host drives it from the host, not from its own container: reaching
  # Docker from inside would mean mounting the daemon socket, which hands any
  # process in that container the whole machine — a far larger hole than the
  # one this sandbox closes. Run agent-host on the host to get the hardened
  # path; in compose it falls back to the in-process browser and says so.
  browser-sandbox:
    build:
      context: packages/browser-drive
      dockerfile: Dockerfile
    image: covenant-browser-sandbox:latest
    profiles: ["build-only"]

  jaeger:
    # 1.76.0 is the newest all-in-one tag on Docker Hub (Dec 2025); Jaeger's own project
    # has since moved active development to the v2 unified image (jaegertracing/jaeger),
    # which uses YAML config instead of the COLLECTOR_OTLP_ENABLED env var below — an
    # intentionally separate migration, out of scope here.
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # query UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://localhost:14269/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  covenant-db:
  covenant-keys:
