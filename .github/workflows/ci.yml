# Local gate == CI gate (§10.2 hook 4): the "gate" job below runs the literal
# .hooks/pre-commit script rather than retyping its command chain, so the two paths
# cannot drift apart.
name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    name: lint, depcruise, test + docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input — pnpm/action-setup reads root package.json's
      # "packageManager" field, the same pin the Dockerfiles' corepack step uses.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the pre-commit gate (lint && depcruise && test)
        run: sh .hooks/pre-commit

      # §12 "latest & verified" policy: visibility only, never fails the build.
      - name: Dependency freshness report (non-blocking)
        run: pnpm -r outdated || true

      - name: Build gateway-svc image
        run: docker build -f apps/gateway-svc/Dockerfile -t covenant-gateway-svc:ci .

      - name: Build audit-ui image
        run: docker build -f apps/audit-ui/Dockerfile -t covenant-audit-ui:ci .

  replay-proof:
    name: replay-proof (ledger fold determinism)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # §10.4 "Backups/replay": re-folding the ledger must reproduce identical state
      # (N3). No-ops via `if` until packages/ledger actually ships tests.
      - name: Ledger fold determinism
        if: hashFiles('packages/ledger/tests/**') != ''
        run: pnpm --filter @covenant/ledger test -- --run
